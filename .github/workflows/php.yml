name: PHP

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**.md'

  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php-versions }} / ${{ matrix.operating-system }})
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest]
        php-versions: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, mysqli, pdo, pdo_mysql, gd, curl, zip
          ini-values: post_max_size=256M, max_execution_time=180, register_argc_argv=1
          coverage: none

      # `php -l` renvoie 0 même lorsqu'il émet un avertissement de dépréciation.
      # On capture donc la sortie et on échoue explicitement si elle n'est pas vide.
      - name: Syntax check & deprecations
        shell: bash
        run: |
          set -uo pipefail
          OUT=$(find App Admin Installation Public index.php cmw \
                  -name '*.php' -type f -print0 2>/dev/null \
                | xargs -0 -n1 -P4 php -l 2>&1 \
                | grep -vE '^No syntax errors' || true)
          if [ -n "$OUT" ]; then
            echo "::error::Erreurs de syntaxe ou dépréciations détectées"
            echo "$OUT"
            exit 1
          fi
          echo "OK — aucune erreur de syntaxe ni dépréciation."

  format:
    name: Formatage (pretty-php)
    runs-on: ubuntu-latest
    # Non bloquant : le reformatage global du dépôt reste un chantier à part
    # (~177 fichiers sur 319 non conformes au 14/08/2026).
    # À passer en bloquant une fois cette dette résorbée.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          ini-values: register_argc_argv=1
          coverage: none

      - name: Check formatting
        run: |
          php pretty-php.phar --check \
            -X '/\/(\.git|node_modules|Vendors|vendor)\//' \
            App Admin Installation index.php
